name: Publish to NuGet

# ONE package for every supported Umbraco major, so the tag is simply the package version:
#   v2.0.0        -> package 2.0.0
#   v2.1.0-beta.1 -> package 2.1.0-beta.1
# Which Umbraco versions the package supports is declared by UmbracoVersionRange in the csproj, not by the
# tag — see the version comment there. Push one tag to release.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Gate the release on the boot matrix: a single binary spanning majors must be proven on every one of
  # them before it can be pushed, because NuGet will not catch a cross-major break for us.
  boot:
    name: Boot
    uses: ./.github/workflows/boot-matrix.yml

  publish:
    needs: boot
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          RAW="${GITHUB_REF_NAME#v}"           # 2.1.0  or  2.1.0-beta.1
          BASE="${RAW%%-*}"                    # 2.1.0
          if [ "$RAW" != "$BASE" ]; then
            SUFFIX="${RAW#*-}"                 # beta.1
          else
            SUFFIX=""
          fi
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' must be v<major>.<minor>.<patch>[-suffix], e.g. v2.1.0 or v2.1.0-beta.1"
            exit 1
          fi
          echo "version=$BASE" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Packing LinkAudit $RAW"

      - name: Pack
        run: >
          dotnet pack src/Umbraco.Community.LinkAudit/Umbraco.Community.LinkAudit.csproj
          --configuration Release
          --output artifacts
          -p:LinkAuditVersion=${{ steps.ver.outputs.version }}
          -p:VersionSuffix=${{ steps.ver.outputs.suffix }}

      - name: Assert the Umbraco dependency range is bounded
        run: |
          set -euo pipefail
          NUPKG=$(ls artifacts/*.nupkg | grep -v symbols | head -1)
          unzip -p "$NUPKG" '*.nuspec' > /tmp/pkg.nuspec
          grep -E '<dependency id="Umbraco' /tmp/pkg.nuspec
          if ! grep -qE '<dependency id="Umbraco[^"]*" version="\[[^)]*\)"' /tmp/pkg.nuspec; then
            echo "::error::Refusing to publish: the Umbraco dependency range is unbounded."
            exit 1
          fi

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: rolfis

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
