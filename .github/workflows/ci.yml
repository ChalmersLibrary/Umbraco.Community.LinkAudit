name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Umbraco.Community.LinkAudit/Umbraco.Community.LinkAudit.csproj -c Release

      - name: Pack
        run: dotnet pack src/Umbraco.Community.LinkAudit/Umbraco.Community.LinkAudit.csproj -c Release --output artifacts

      # The declared range is the package's compatibility contract and the only thing the Marketplace reads.
      # An unbounded range would advertise support for Umbraco majors that have never been tested — the
      # defect this project deliberately avoids.
      - name: Assert the Umbraco dependency range is bounded
        run: |
          set -euo pipefail
          NUPKG=$(ls artifacts/*.nupkg | grep -v symbols | head -1)
          echo "Inspecting $NUPKG"
          unzip -p "$NUPKG" '*.nuspec' > /tmp/pkg.nuspec
          grep -E '<dependency id="Umbraco' /tmp/pkg.nuspec
          if grep -qE '<dependency id="Umbraco[^"]*" version="\[[^)]*\)"' /tmp/pkg.nuspec; then
            echo "OK: Umbraco dependencies declare a bounded range."
          else
            echo "::error::Umbraco dependency range is unbounded. An open range makes the Marketplace claim support for untested majors."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # One binary for all majors means NuGet no longer catches a cross-major break at restore time.
  # This is the replacement safety net.
  boot:
    name: Boot
    uses: ./.github/workflows/boot-matrix.yml
