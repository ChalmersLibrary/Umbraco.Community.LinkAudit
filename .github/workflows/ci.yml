name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Umbraco.Community.LinkAudit/Umbraco.Community.LinkAudit.csproj -c Release

      - name: Pack
        run: dotnet pack src/Umbraco.Community.LinkAudit/Umbraco.Community.LinkAudit.csproj -c Release --output artifacts

      # Inspect the real artifact: that the backoffice manifest is in it (Umbraco discovers the package by
      # that file, and a build alone cannot tell you it was packed) and that the Umbraco dependency range
      # is bounded (the compatibility contract, and the only thing the Marketplace reads).
      - name: Assert the package is installable and discoverable
        run: ./test/assert-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # One binary for all majors means NuGet no longer catches a cross-major break at restore time.
  # This is the replacement safety net.
  boot:
    name: Boot
    uses: ./.github/workflows/boot-matrix.yml
